<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f5f"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png"><title>내 기본정보</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}
header{background:#173f5f;color:#fff;padding:20px;text-align:center}header h1{margin:0;font-size:25px}main{max-width:650px;margin:auto;padding:16px}
.box{background:#fff;border:1px solid #dce3eb;border-radius:18px;padding:16px;box-shadow:0 3px 12px rgba(20,35,55,.06)}
label{display:block;font-weight:700;margin:13px 0 6px}input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#173f5f;color:#fff}.actions{display:flex;gap:9px;margin-top:18px}.secondary{background:#eef2f6;color:#344054}
.note{font-size:13px;color:#667085;line-height:1.5;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.97);border-top:1px solid #d8dee8;display:flex;justify-content:center;gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px rgba(0,0,0,.08)}
nav a{flex:1;max-width:150px;text-decoration:none;text-align:center;color:#344054;background:#f5f7fa;border-radius:12px;padding:8px 4px;font-size:12px;font-weight:700;line-height:1.25}nav a.active{background:#173f5f;color:#fff}
</style></head><body><header><h1>👤 내 기본정보</h1></header><main><div class="box">
<label>사용자 이름</label><input id="userName">
<label>나무병원 이름</label><input id="hospitalName">
<label>나무병원 등록번호</label><input id="hospitalReg">
<label>나무의사 이름</label><input id="doctorName">
<label>나무의사 자격번호</label><input id="doctorLicense">
<label>전화번호</label><input id="phone" inputmode="tel">
<label>주소</label><textarea id="address"></textarea>
<label>이메일</label><input id="email" type="email">
<div class="actions"><button id="save">저장</button><button id="clear" class="secondary">지우기</button></div>
<div class="note">저장한 정보는 이 기기의 브라우저에 보관되며, 통합 PWA의 진단서·처방전·진료부·기초현황조사표에서 활용됩니다.</div>
</div></main>
<nav><a href="index.html" class="">🏠<br>홈</a><a href="diagnosis/index.html" class="">🩺<br>진단서</a><a href="prescription/index.html" class="">💊<br>처방전</a><a href="jinryobu/index.html" class="">📋<br>진료부</a><a href="survey/index.html" class="">🌳<br>기초조사</a><a href="profile.html" class="active">👤<br>기본정보</a><a href="manager.html" class="">📁<br>자료관리</a><a href="resources.html" class="">🔎<br>생물정보</a></nav>
<script>
const KEY='treeDiagnosisProfile', ids=['userName','hospitalName','hospitalReg','doctorName','doctorLicense','phone','address','email'];
const load=()=>{try{const p=JSON.parse(localStorage.getItem(KEY)||'{}');ids.forEach(id=>document.getElementById(id).value=p[id]||'')}catch(e){}};
document.getElementById('save').onclick=()=>{const p={};ids.forEach(id=>p[id]=document.getElementById(id).value.trim());localStorage.setItem(KEY,JSON.stringify(p));alert('기본정보를 저장했습니다.');};
document.getElementById('clear').onclick=()=>{if(confirm('기본정보를 모두 지울까요?')){localStorage.removeItem(KEY);load()}};
load();
</script><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="sync.js"></script></body></html>
