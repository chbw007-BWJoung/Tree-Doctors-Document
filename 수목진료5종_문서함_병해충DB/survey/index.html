<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기초현황조사표(I형 집단목)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수목 안전진단 현황조사표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#fff;--fg:#111;--hd:#e6e6e6;--ln:#222;--ac:#1a6fd4;--pop:#fff;--hl:#dcdcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--fg:#eee;--hd:#333;--ln:#888;--pop:#262626;--hl:#3c3c3c}}
:root[data-theme="dark"]{--bg:#1b1b1b;--fg:#eee;--hd:#333;--ln:#888;--pop:#262626;--hl:#3c3c3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bar{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap}
.bar h1{font-size:18px;margin:0 auto 0 0}
button{font:inherit;padding:8px 14px;border:1px solid var(--ln);background:var(--hd);color:var(--fg);border-radius:8px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
html,body{height:100%}
body{display:flex;flex-direction:column}
.bar{flex:none}
.info{flex:none;padding:2px 12px 10px;font-size:15px}
.info .row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-top:6px}
.info .row:first-child{margin-top:0}
.info>span{cursor:pointer}
.info b{white-space:nowrap}
.ph{opacity:.55}
.info img{display:inline-block;vertical-align:middle;max-height:32px}
.wrap{flex:1;min-height:0;overflow:auto;max-width:100%;border-top:1px solid var(--ln);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;border-left:1px solid var(--ln);min-width:1250px;width:100%;table-layout:fixed}
th,td{border:0;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);text-align:center;font-size:13px}
th{background:var(--hd);padding:6px 2px;line-height:1.3;font-weight:600;position:sticky;top:0;z-index:3}
td.sc0,td.sc1,th.sc0,th.sc1{position:sticky;background:var(--bg)}
td.sc0,td.sc1{z-index:1}
tr.hl td{background:var(--hl)!important}
tr.hl td.sc0,tr.hl td.sc1{background:var(--hl)!important}
th.sc0,th.sc1{z-index:4}
td.sc0,th.sc0{left:0;min-width:36px;width:36px}
td.sc1,th.sc1{min-width:64px;width:64px}
td{height:40px;cursor:pointer;overflow:hidden;padding:0}
td:active{background:#1a6fd433}
td img{max-height:36px;max-width:100%;display:block;margin:auto}
#ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#ov.on{display:flex}
.pop{background:var(--pop);border-radius:14px;padding:16px;width:min(560px,100%);max-height:100%;overflow:auto}
.pop h2{margin:0 0 10px;font-size:17px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button.on{background:var(--ac);color:#fff}
#txt{width:100%;box-sizing:border-box;font-size:40px;padding:14px;border:2px solid var(--ac);border-radius:10px;background:var(--bg);color:var(--fg)}
#cv{width:100%;height:220px;border:2px solid var(--ac);border-radius:10px;background:#fff;touch-action:none;display:none}
.act{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.act button{font-size:17px;padding:12px 20px}
td.chk{font-size:20px;font-weight:700;color:var(--ac)}
#opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#opts button{font-size:18px;padding:12px 14px;flex:1 1 45%}
#cvt{display:none;margin-top:8px}
.hint{font-size:12px;opacity:.7;margin:6px 0 0}
#integratedNav{gap:3px!important;padding-left:6px!important;padding-right:6px!important}#integratedNav a{flex:1 0 auto!important;padding:8px 2px!important;font-size:10.5px!important;white-space:nowrap}</style>
<style id="integrated-nav-style">
#integratedNav{position:fixed;left:0;right:0;bottom:0;z-index:99999;background:rgba(255,255,255,.97);border-top:1px solid #d8dee8;display:flex;justify-content:center;gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px rgba(0,0,0,.08);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#integratedNav a{flex:1;max-width:150px;text-decoration:none;text-align:center;color:#344054;background:#f5f7fa;border-radius:12px;padding:8px 4px;font-size:12px;font-weight:700;line-height:1.25}
#integratedNav a.active{background:#173f5f;color:#fff}
body{padding-bottom:78px!important}
@media print{#integratedNav{display:none!important}body{padding-bottom:0!important}}
</style>
<script src="../sync/config.js"></script><script src="../sync/sync.js"></script>
</head><body>
<div class="bar"><h1>기초현황조사표(I형 집단목)</h1>
<label>행 수 <input id="rn" type="number" min="1" max="500" style="width:70px;font:inherit;padding:7px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg)"></label><button id="add">적용</button><button id="csv">CSV 내보내기</button><button id="xlsx" class="p">엑셀 저장(.xlsx)</button><button id="clr">전체 지우기</button></div>
<div id="info" class="info"></div>
<div class="wrap"><table id="t"></table></div>

<div id="ov"><div class="pop">
<h2 id="ttl"></h2>
<div class="tabs"><button id="tt" class="on">키보드 입력</button><button id="th">손글씨</button></div>
<div id="opts"></div>
<input id="txt" autocomplete="off">
<canvas id="cv"></canvas>
<button id="cvt" class="p">글자로 변환</button>
<p class="hint" id="hint">아이패드는 Apple Pencil로 입력창에 바로 써도 글자로 변환됩니다.</p>
<div class="act"><button id="rs">지우기</button><button id="cc">취소</button><button id="ok" class="p">입력</button></div>
</div></div>

<script>
// 열 정의: [라벨, 숫자여부]
const G=[["",[["No.",0,1]]],["",[["수종"]]],
["수목형상",[["수고",1,"(m)"],["흉고\n직경",1,"(cm)"],["수관폭",1,"(m)"],["지하고",1,"(m)"]]],
["줄기부 결함",[["균열\n부후\n공동"],["가지\n고사"],["가지\n찢어짐"],["기타"]]],
["뿌리부 결함",[["균열\n부후\n공동"],["뿌리\n절단"],["뿌리\n조임\n병목"],["기타"]]],
["줄기 기울기",[["기울기",0,"( °)"],["방향"],["수간형"]]],
["피해 대상물",[["존재"],["부존재"]]],
["활력도",[["측정값",0,"",1]]],
["",[["예비\n평가"]]],["",[["비고"]]]];
const OPTS=[["A","A (건전)"],["B","B (관리대상목)"],["C","C (정밀평가대상목)"],["D","D (제거대상목)"]];
const OPT_SLOPE=[["안전","안전 (10도 이하)"],["약간위험","약간위험 (11~14도)"],["위험","위험 (15~24도)"],["매우위험","매우위험 (25도 이상)"]];
const OPT_DIR=[["도로","도로"],["인도","인도"],["역방향","역방향"],["순방향","순방향"]];
const OPT_VIT=[["T/S메타","T/S메타"],["준스메타","준스메타"],["%값","%값"],["샤이고메타","샤이고메타"]];
const OPT_FORM=[["만곡형","만곡형"],["궁형","궁형"],["선형","선형"]];
const cols=[];G.forEach(g=>g[1].forEach(c=>cols.push({n:c[0].replace(/\n/g,""),lbl:c[0],num:!!c[1],u:c[2]||"",vit:!!c[3],grp:g[0],chk:(["피해 대상물","줄기부 결함","뿌리부 결함"].includes(g[0])&&c[0]!=="기타"),ex:g[0]==="피해 대상물",opts:c[0]==="예비\n평가"?OPTS:c[0]==="기울기"?OPT_SLOPE:c[0]==="수간형"?OPT_FORM:c[0]==="방향"?OPT_DIR:null})));
const EX=cols.map((c,i)=>c.ex?i:-1).filter(i=>i>=0);
const KEY="tree-survey-v1";
let rows=30,data={},meta={};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s){rows=s.rows||30;data=s.data||{};meta=s.meta||{};
 const v=s.ver||1;const mv=f=>{const d={};Object.keys(data).forEach(k=>{const [r,c]=k.split("_").map(Number);const n=f(c);if(n>=0)d[r+"_"+n]=data[k]});data=d};
 if(v<2)mv(c=>c<14?c:c>14?c+1:-1);
 if(v<3)mv(c=>c<=14?c:c<=17?c+1:c==18?20:c==19?21:-1)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ver:3,rows,data,meta}))}catch(e){}}
function build(){
 const t=document.getElementById("t");let h="<tr>";let i=0;
 G.forEach(g=>{const w=g[1].length;
  if(!g[0])g[1].forEach(c=>{h+=`<th rowspan="2" class="sc${i}" style="white-space:pre-line">${c[0]}</th>`;i++});
  else h+=`<th colspan="${w}">${g[0]}</th>`});
 h+="</tr><tr>";
 G.forEach(g=>{if(g[0])g[1].forEach(c=>h+=(c[3]?`<th class="vh" style="white-space:pre-line;cursor:pointer;color:var(--ac)">${vlabel()}</th>`:`<th style="white-space:pre-line">${c[0]}${c[2]?"\n"+c[2]:""}</th>`))});
 h+="</tr>";
 for(let r=0;r<rows;r++){h+="<tr>";
  cols.forEach((c,i)=>{const k=r+"_"+i;let v=data[k]||"";
   if(i==0&&!v)v=r+1;
   h+=`<td data-r="${r}" data-c="${i}" class="${i<2?"sc"+i:""}${c.chk?" chk":""}">${render(v)}</td>`});
  h+="</tr>"}
 t.innerHTML=h;fixTop();renderInfo();
}
function render(v){if(typeof v==="string"&&v.startsWith("data:image"))return `<img src="${v}">`;return String(v).replace(/</g,"&lt;")}
document.getElementById("t").addEventListener("click",e=>{if(e.target.closest("th.vh")){openHead();return}const td=e.target.closest("td");if(!td)return;
 if(+td.dataset.c===0){const tr=td.parentElement,on=tr.classList.contains("hl");
  document.querySelectorAll("#t tr.hl").forEach(x=>x.classList.remove("hl"));
  if(!on)tr.classList.add("hl");return}const r=+td.dataset.r,c=+td.dataset.c;if(cols[c].chk)toggle(r,c);else openPop(r,c)});
function setCell(r,c,v){const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);if(td)td.innerHTML=render(v)}
function toggle(r,c){const k=r+"_"+c;const sc=cols[c].ex?EX.find(i=>i!==c):-1,sib=r+"_"+sc;
 if(data[k]){delete data[k];setCell(r,c,"")}else{data[k]="✓";setCell(r,c,"✓");if(sc>=0&&data[sib]){delete data[sib];setCell(r,sc,"")}}
 save()}

const ov=document.getElementById("ov"),txt=document.getElementById("txt"),cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let cur=null,mode="t",drawn=false;
function setMode(m){mode=m;txt.style.display=m=="t"?"block":"none";cv.style.display=m=="h"?"block":"none";
 document.getElementById("tt").classList.toggle("on",m=="t");document.getElementById("th").classList.toggle("on",m=="h");
 document.getElementById("hint").textContent=m=="t"?"아이패드는 Apple Pencil로 입력창에 바로 써도 글자로 변환됩니다.":"손글씨는 이미지 그대로 칸에 저장됩니다.";
 document.getElementById("cvt").style.display=(m=="h"&&SM)?"block":"none";
 if(m=="h")initCv();else txt.focus()}
function initCv(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;
 ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#000";drawn=false;ctx.clearRect(0,0,cv.width,cv.height)}
function openPop(r,c){cur={r,c};const k=r+"_"+c,col=cols[c];
 document.getElementById("ttl").textContent=`${r+1}번 · ${col.grp?col.grp+" › ":""}${col.n}`;
 const v=data[k]||"";txt.value=(typeof v==="string"&&v.startsWith("data:"))?"":(c==0&&!v?"":v);
 txt.inputMode=col.num?"decimal":"text";const oe=document.getElementById("opts");oe.innerHTML="";
 if(col.opts){oe.style.display="flex";col.opts.forEach(o=>{const b=document.createElement("button");b.textContent=o[1];if(txt.value===o[0])b.className="p";b.onclick=()=>{txt.value=o[0];document.getElementById("ok").click()};oe.appendChild(b)})}else oe.style.display="none";
 showEdit(true);ov.classList.add("on");setMode("t");setTimeout(()=>txt.focus(),50)}
function fixTop(){const t=document.getElementById("t");if(!t.rows.length)return;const h1=t.rows[0].offsetHeight;
 const c0=t.querySelector(".sc0");if(c0){const w0=c0.offsetWidth;[...t.querySelectorAll(".sc1")].forEach(c=>c.style.left=w0+"px")}
 [...t.rows[1].cells].forEach(c=>c.style.top=h1+"px")}
addEventListener("resize",fixTop);addEventListener("load",fixTop);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function renderInfo(){
 document.getElementById("info").innerHTML=
  `<div class="row"><span id="infoBtn"><b>기본정보 :</b> ${render(meta.info||"")||"<span class='ph'>터치하여 입력</span>"}</span></div>`+
  `<div class="row"><span id="dateBtn"><b>날짜 :</b> ${render(meta.date||today())}</span>`+
  `<span id="srvBtn"><b>조사자 :</b> ${meta.srv!==undefined?render(meta.srv):"<span class='ph'>정 병 욱</span>"}</span></div>`;
 document.getElementById("infoBtn").onclick=openInfo;
 document.getElementById("dateBtn").onclick=openDate;
 document.getElementById("srvBtn").onclick=openSrv}
function openDate(){cur={date:1};showEdit(true);document.getElementById("ttl").textContent="조사 날짜";
 const oe=document.getElementById("opts");oe.innerHTML="";oe.style.display="none";
 txt.type="date";txt.inputMode="none";txt.value=meta.date||today();
 ov.classList.add("on");setMode("t");setTimeout(()=>txt.focus(),50)}
function openSrv(){cur={srv:1};showEdit(true);document.getElementById("ttl").textContent="조사자";
 const oe=document.getElementById("opts");oe.innerHTML="";oe.style.display="none";
 txt.type="text";txt.inputMode="text";txt.value=meta.srv!==undefined?meta.srv:"정 병 욱";
 ov.classList.add("on");setMode("t");setTimeout(()=>txt.focus(),50)}
function openInfo(){cur={info:1};showEdit(true);document.getElementById("ttl").textContent="기본정보";
 const oe=document.getElementById("opts");oe.innerHTML="";oe.style.display="none";
 const v=meta.info||"";txt.value=(typeof v==="string"&&!v.startsWith("data:"))?v:"";txt.inputMode="text";txt.type="text";
 ov.classList.add("on");setMode("t");setTimeout(()=>txt.focus(),50)}
function csvTop(){const i=(typeof meta.info==="string"&&!meta.info.startsWith("data:"))?meta.info:(meta.info?"(손글씨)":"");
 const d=meta.date||today(),sv=meta.srv!==undefined?meta.srv:"정 병 욱";
 return '"'+"기초현황조사표(I형 집단목)"+'"\n"기본정보 : '+i.replace(/"/g,'""')+' / 날짜 : '+d+' / 조사자 : '+sv.replace(/"/g,'""')+'"'}
function vlabel(){return (meta.vit||"방식 선택")+" ▾"}
function showEdit(on){document.querySelector(".tabs").style.display=on?"":"none";
 ["hint","rs","ok"].forEach(i=>document.getElementById(i).style.display=on?"":"none");
 if(!on){txt.style.display=cv.style.display="none";document.getElementById("cvt").style.display="none"}}
function openHead(){cur=null;showEdit(false);document.getElementById("ttl").textContent="활력도 측정방식 선택";
 const oe=document.getElementById("opts");oe.innerHTML="";oe.style.display="flex";
 OPT_VIT.concat([["","선택 해제"]]).forEach(o=>{const b=document.createElement("button");b.textContent=o[1];if(o[0]&&meta.vit===o[0])b.className="p";
  b.onclick=()=>{if(o[0])meta.vit=o[0];else delete meta.vit;save();document.querySelector("th.vh").innerHTML=vlabel();close()};oe.appendChild(b)});
 ov.classList.add("on")}
function close(){ov.classList.remove("on");cur=null}
let SM=null;
(async()=>{try{const s=window.claude&&await claude.use("sample");if(s){const l=await s.limits().catch(()=>null);if(l&&l.images){SM=s;if(mode=="h")document.getElementById("cvt").style.display="block"}}}catch(e){}})();
const cvt=document.getElementById("cvt");
cvt.onclick=async()=>{if(!SM||!drawn)return;cvt.disabled=true;cvt.textContent="변환 중...";
 try{const s=document.createElement("canvas");s.width=cv.width;s.height=cv.height;const x=s.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,s.width,s.height);x.drawImage(cv,0,0);
  const b=await new Promise(r=>s.toBlob(r,"image/png"));const col=cols[cur.c]||{n:"기본정보",num:0};
  const {text}=await SM("이미지는 손으로 쓴 글씨입니다. 쓰인 내용을 그대로 글자로 옮기세요. 한글, 숫자, 소수점, 기호를 정확히 읽고, 설명 없이 옮긴 텍스트만 출력하세요."+(col.num?" 이 칸은 숫자 칸입니다.":"")+" 항목: "+col.n,{images:b,modelTier:"quick"});
  txt.value=text.trim();setMode("t");document.getElementById("hint").textContent="변환 결과를 확인하고 필요하면 고친 뒤 [입력]을 누르세요."}
 catch(e){alert("변환하지 못했습니다. 다시 쓰거나 키보드로 입력해 주세요.")}
 finally{cvt.disabled=false;cvt.textContent="글자로 변환"}};
let down=false;
cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);const p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();drawn=true});
cv.addEventListener("pointermove",e=>{if(!down)return;const p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,()=>down=false));
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
document.getElementById("tt").onclick=()=>setMode("t");
document.getElementById("th").onclick=()=>setMode("h");
document.getElementById("rs").onclick=()=>{txt.value="";if(mode=="h")initCv()};
document.getElementById("cc").onclick=close;
ov.addEventListener("click",e=>{if(e.target==ov)close()});
txt.addEventListener("keydown",e=>{if(e.key=="Enter")document.getElementById("ok").click()});
document.getElementById("ok").onclick=()=>{if(!cur)return;const k=cur.r+"_"+cur.c;let v;
 if(mode=="h"){if(drawn){const s=document.createElement("canvas");s.width=300;s.height=Math.round(300*cv.height/cv.width);
   const x=s.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,s.width,s.height);x.drawImage(cv,0,0,s.width,s.height);v=s.toDataURL("image/png")}else v=""}
 else v=txt.value.trim();
 if(cur.info){if(v)meta.info=v;else delete meta.info;save();renderInfo();close();return}
 if(cur.date){meta.date=v||today();save();renderInfo();close();return}
 if(cur.srv){meta.srv=v;save();renderInfo();close();return}
 if(v)data[k]=v;else delete data[k];
 save();const td=document.querySelector(`td[data-r="${cur.r}"][data-c="${cur.c}"]`);
 td.innerHTML=render(v||(cur.c==0?cur.r+1:""));close()};
const rn=document.getElementById("rn");rn.value=rows;
document.getElementById("add").onclick=()=>{const n=Math.max(1,Math.min(500,parseInt(rn.value)||rows));
 if(n<rows){const lost=Object.keys(data).some(k=>+k.split("_")[0]>=n);if(lost&&!confirm(`${n}행 이후에 입력한 데이터가 삭제됩니다. 계속할까요?`)){rn.value=rows;return}

// XLSX 내보내기: 병합 머리글, 열 너비, 테두리와 기본정보를 엑셀에 반영합니다.
let xlsxLoading=null;
function loadXlsx(){
 if(window.XLSX)return Promise.resolve(window.XLSX);
 if(xlsxLoading)return xlsxLoading;
 xlsxLoading=new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js";
  script.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error("XLSX 라이브러리를 불러오지 못했습니다."));
  script.onerror=()=>reject(new Error("엑셀 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요."));
  document.head.appendChild(script);
 });
 return xlsxLoading;
}
function exportXlsx(XLSX){
 const aoa=[];
 const title="기초현황조사표(I형 집단목)";
 const info=(typeof meta.info==="string"&&!meta.info.startsWith("data:"))?meta.info:(meta.info?"(손글씨)":"");
 const date=meta.date||today(),srv=meta.srv!==undefined?meta.srv:"정 병 욱";
 aoa.push([title]);
 aoa.push([`기본정보 : ${info} / 날짜 : ${date} / 조사자 : ${srv}`]);
 const groupRow=[], subRow=[], merges=[];let ci=0;
 G.forEach(g=>{
  const start=ci,w=g[1].length;
  if(!g[0]){
   g[1].forEach(c=>{groupRow[ci]=c[0].replace(/\n/g," ");subRow[ci]="";merges.push({s:{r:2,c:ci},e:{r:3,c:ci}});ci++});
  }else{
   groupRow[start]=g[0];
   if(w>1)merges.push({s:{r:2,c:start},e:{r:2,c:start+w-1}});
   g[1].forEach(c=>{subRow[ci]=c[0].replace(/\n/g," ")+(c[2]?"\n"+c[2]:"");if(c[3])subRow[ci]=vlabel();ci++});
  }
 });
 aoa.push(groupRow,subRow);
 for(let r=0;r<rows;r++){
  aoa.push(cols.map((c,i)=>{let v=data[r+"_"+i]||(i===0?r+1:"");return typeof v==="string"&&v.startsWith("data:image")?"(손글씨)":v}));
 }
 const ws=XLSX.utils.aoa_to_sheet(aoa);
 const ncol=cols.length;
 ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:ncol-1}},{s:{r:1,c:0},e:{r:1,c:ncol-1}},...merges];
 ws["!cols"]=cols.map((c,i)=>({wch:i===0?5:i===1?12:Math.max(9,Math.min(16,Math.ceil((c.n||"").length*1.8+(c.u||"").length+2)))}));
 ws["!rows"]=[{hpt:25},{hpt:22},{hpt:26},{hpt:42},...Array.from({length:rows},()=>({hpt:25}))];
 const border={top:{style:"thin",color:{rgb:"555555"}},bottom:{style:"thin",color:{rgb:"555555"}},left:{style:"thin",color:{rgb:"555555"}},right:{style:"thin",color:{rgb:"555555"}}};
 const headerFill={patternType:"solid",fgColor:{rgb:"E6E6E6"}};
 for(let r=0;r<aoa.length;r++)for(let c=0;c<ncol;c++){
  const addr=XLSX.utils.encode_cell({r,c});if(!ws[addr])ws[addr]={t:"s",v:""};
  ws[addr].s={font:{name:"맑은 고딕",sz:r<4?10:9,bold:r<4},alignment:{horizontal:"center",vertical:"center",wrapText:true},border};
  if(r<4)ws[addr].s.fill=headerFill;
 }
 ws["A1"].s={font:{name:"맑은 고딕",sz:15,bold:true},alignment:{horizontal:"center",vertical:"center"},fill:headerFill,border};
 ws["A2"].s={font:{name:"맑은 고딕",sz:10},alignment:{horizontal:"left",vertical:"center",wrapText:true},border};
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"기초현황조사표");
 XLSX.writeFile(wb,"기초현황조사표.xlsx");
}
document.getElementById("xlsx").onclick=async()=>{
 const b=document.getElementById("xlsx");b.disabled=true;b.textContent="엑셀 준비 중…";
 try{exportXlsx(await loadXlsx())}catch(e){alert(e.message||"엑셀 파일을 만들지 못했습니다.")}
 finally{b.disabled=false;b.textContent="엑셀 저장(.xlsx)"}
};
build();
